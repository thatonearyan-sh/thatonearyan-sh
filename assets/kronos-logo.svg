<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t02">
  <title id="t02">Kronos — Arc mark</title>

  <defs>
    <!-- NOIR LADDER. Sampled from the bot avatar: saturation 0.002 (pure
         greyscale), median luminance 3/255, 83% of pixels below 32.
         Crushed blacks, highlights spent sparingly. No hue anywhere. -->
    <linearGradient id="bone" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0"    stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#CFCFCF"/>
      <stop offset="1"    stop-color="#6E6E6E"/>
    </linearGradient>

    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E8E8E"/>
      <stop offset="1" stop-color="#4A4A4A"/>
    </linearGradient>

    <!-- GROUND — radial, hot spot upper-left matching the light on the ring.
         Peaks at #171717 and falls to near-pure black, mirroring the avatar's
         low-key falloff rather than sitting on a flat fill. -->
    <radialGradient id="ground" cx="0.38" cy="0.30" r="0.88">
      <stop offset="0"    stop-color="#1A1A1A"/>
      <stop offset="0.55" stop-color="#0E0E0E"/>
      <stop offset="1"    stop-color="#050505"/>
    </radialGradient>

    <!-- FILM GRAIN — fractal noise, desaturated, screened back hard.
         Carries the avatar's texture without touching the geometry. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="ng"/>
      <feComponentTransfer in="ng" result="nc">
        <feFuncA type="linear" slope="0.42" intercept="0"/>
      </feComponentTransfer>
      <feComposite in="nc" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#ground)"/>

  <!-- OUTER — r=180, 270° of arc. 0° (436,256) → 270° (256,76).
       Read as a clock sweep: three quarters elapsed, the fourth open.
       Stroke 26 → outer edge 193, inner edge 167. -->
  <path d="M 436 256
           A 180 180 0 1 1 256 76"
        fill="none" stroke="url(#bone)" stroke-width="26" stroke-linecap="round"/>

  <!-- INNER — r=104, 180° counter-sweep through the top.
       Stroke 26 → outer edge 117, so a 50px clear channel (167 − 117).
       Steel, not bone: it recedes, so the outer ring stays the primary read. -->
  <path d="M 152 256
           A 104 104 0 0 1 360 256"
        fill="none" stroke="url(#steel)" stroke-width="26" stroke-linecap="round"/>

  <!-- MIDDLE — hairline at r=142, dead centre of the 50px channel.
       90° through the south-east, bridging the outer gap. -->
  <path d="M 356.42 356.42
           A 142 142 0 0 1 256 398"
        fill="none" stroke="#6E6E6E" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

  <!-- TERMINAL at 315° on r=180: (383.28, 383.28).
       Pure white, and the only pure white in the mark — the 2% highlight,
       spent exactly once, the way the avatar spends its own. -->
  <circle cx="383.28" cy="383.28" r="14" fill="#FFFFFF"/>
  <circle cx="383.28" cy="383.28" r="5"  fill="#0A0A0A"/>

  <!-- Grain laid over the whole composition at low opacity. -->
  <rect width="512" height="512" filter="url(#grain)" fill="#FFFFFF" opacity="0.055"/>
</svg>
