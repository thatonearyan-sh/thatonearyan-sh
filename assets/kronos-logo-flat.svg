<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t02f">
  <title id="t02f">Kronos — Arc mark, flat</title>

  <!-- SMALL-SIZE VARIANT.
       · No gradients, no grain — both turn to mud below 32px.
       · No hairline bridge — 5px vanishes at favicon size.
       · Strokes 26 → 44 so the ring survives at 16px (44/512 × 16 ≈ 1.4px).
       · Radii pulled in (180→166, 104→88) to hold the same silhouette.
       · Two flat greys. Prints, embroiders, stencils. -->

  <rect width="512" height="512" rx="112" fill="#0E0E0E"/>

  <path d="M 422 256
           A 166 166 0 1 1 256 90"
        fill="none" stroke="#F2F2F2" stroke-width="44" stroke-linecap="round"/>

  <path d="M 168 256
           A 88 88 0 0 1 344 256"
        fill="none" stroke="#7A7A7A" stroke-width="44" stroke-linecap="round"/>

  <circle cx="373.38" cy="373.38" r="22" fill="#FFFFFF"/>
</svg>
