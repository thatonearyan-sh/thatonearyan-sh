<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="TG-KRONOS Logo">
  <title>TG-KRONOS — Telephony Engine Logo</title>
  <rect width="128" height="128" rx="16" fill="#000000"/>
  <rect x="4" y="4" width="120" height="120" rx="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cyber Architectural K Monogram -->
  <g fill="white" filter="url(#glow)">
    <!-- Left vertical stem with subtle micro-fillet -->
    <rect x="36" y="32" width="14" height="52" rx="2"/>
    <!-- Upper ascending arm -->
    <polygon points="50,58 76,32 92,32 63,61"/>
    <!-- Lower descending arm -->
    <polygon points="59,54 92,84 76,84 50,60"/>
  </g>

  <!-- Subtle bottom line accent identical to ExamCodes -->
  <line x1="32" y1="104" x2="96" y2="104" stroke="white" stroke-width="2" opacity="0.6"/>
  <line x1="40" y1="110" x2="88" y2="110" stroke="white" stroke-width="1.5" opacity="0.3"/>
</svg>