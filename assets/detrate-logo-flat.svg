<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DETRATEBTU Oracle Mark">
  <title>DETRATEBTU — Oracle Delta Mark</title>
  <rect width="512" height="512" rx="112" fill="#0E0E0E"/>
  
  <!-- Outer Delta / Rate Vector: Sweeping mathematical D-Delta hybrid -->
  <!-- Left vertical telemetry pillar -->
  <line x1="164" y1="136" x2="164" y2="376" stroke="#F2F2F2" stroke-width="44" stroke-linecap="round"/>
  
  <!-- Precision Oracle Arc: Sweeps from top pillar out to 366px and returns to bottom pillar -->
  <path d="M 164 136 C 356 136 386 230 386 256 C 386 282 356 376 164 376" 
        fill="none" stroke="#F2F2F2" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Inner Delta Trend Beam: Rate of change (Δ) ascending diagonal -->
  <path d="M 216 324 L 296 220" 
        fill="none" stroke="#7A7A7A" stroke-width="36" stroke-linecap="round"/>
        
  <!-- Horizontal consensus baseline -->
  <line x1="216" y1="324" x2="304" y2="324" stroke="#505050" stroke-width="16" stroke-linecap="round"/>

  <!-- Live Oracle Terminal Pulse: 2% highlight node spent on the apex -->
  <circle cx="386" cy="256" r="22" fill="#FFFFFF"/>
  <circle cx="386" cy="256" r="8" fill="#0E0E0E"/>
</svg>
